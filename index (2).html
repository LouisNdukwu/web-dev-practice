<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Community Volunteer Interest Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Volunteer With Us</h1>
    <p>Interested in supporting our community? Complete the form below to explore volunteer opportunities.</p>

    <!-- This is a practice form. It does not send or save information. -->
    <form id="volunteerForm" novalidate>

        <!---Fix 1: label "for" now matches the input id ("name"), so they are now connected-->
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name">

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email">

        <label for="interest">Area of Interest</label>
        <select id="interest" name="interest">
            <option value="">Select an option</option>

            <!---Fix 2: empty placeholder option so no interest is chosen by default-->
            <option value="outreach">Community Outreach</option>
            <option value="events">Event Support</option>
            <option value="mentoring">Youth Mentoring</option>
        </select>

        <button type="submit">Submit Interest</button>
    </form>

    <!---Fix 3: Add aria-live attribute to result paragraph for screen reader support. It ensures the content is announced when it changes.-->

    <p id="result" aria-live="polite"></p>

    <script src="volunteer.js"></script>
</body>
</html>
